<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سبيل الإعراب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F6F1E4; --bg-elevated: #FFFDF7; --ink: #FFFE2A; --ink-soft: #5B6B63;
  --teal: #1B4B43; --teal-deep: #123832; --teal-contrast: #FFFFFF;
  --gold: #A5761F; --gold-soft: #EADFC0;
  --success: #2F7D4F; --success-soft: #DCEEE1;
  --error: #B5443A; --error-soft: #F6DFDB;
  --border: #E4D9BE;
  --shadow: 0 1px 2px rgba(27,46,42,0.06), 0 8px 24px rgba(27,46,42,0.08);
  color-scheme: light; box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F211E; --bg-elevated: #16302B; --ink: #EDE6D3; --ink-soft: #A9B6AE;
    --teal: #5CB3A0; --teal-deep: #163832; --teal-contrast: #0F211E;
    --gold: #D9B45C; --gold-soft: #26433C;
    --success: #5FBF8C; --success-soft: #1C3A2C;
    --error: #E08276; --error-soft: #3B211E;
    --border: #24413B;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F211E; --bg-elevated: #16302B; --ink: #EDE6D3; --ink-soft: #A9B6AE;
  --teal: #5CB3A0; --teal-deep: #163832; --teal-contrast: #0F211E;
  --gold: #D9B45C; --gold-soft: #26433C;
  --success: #5FBF8C; --success-soft: #1C3A2C;
  --error: #E08276; --error-soft: #3B211E;
  --border: #24413B;
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin:0; padding:0; height:100%; background:var(--bg); color:var(--ink); font-family:'Cairo',sans-serif; -webkit-text-size-adjust:100%; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body { min-height:100%; display:flex; flex-direction:column; }

.topbar { position:sticky; top:0; z-index:10; padding: calc(10px + env(safe-area-inset-top,0px)) 16px 10px; background:var(--teal); color:var(--teal-contrast); display:flex; align-items:center; justify-content:space-between; box-shadow:var(--shadow); }
.topbar h1 { font-size:1.05rem; margin:0; font-weight:800; }
.stats { display:flex; gap:14px; align-items:center; font-weight:700; font-size:0.92rem; }
.stat { display:flex; align-items:center; gap:4px; }

.wrap { max-width:560px; margin:0 auto; width:100%; padding:16px 16px 100px; flex:1; }

.tabs { position:fixed; bottom:0; left:0; right:0; z-index:10; display:flex; background:var(--bg-elevated); border-top:1px solid var(--border); padding-bottom:env(safe-area-inset-bottom,0px); }
.tab { flex:1; text-align:center; padding:10px 0 8px; border:none; background:none; color:var(--ink-soft); font-family:'Cairo',sans-serif; font-weight:700; font-size:0.72rem; cursor:pointer; }
.tab.active { color:var(--teal); }
.tab .icon { display:block; font-size:1.25rem; margin-bottom:1px; }

.card { background:var(--bg-elevated); border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow); overflow:hidden; }

.chip-row { display:flex; gap:8px; overflow-x:auto; padding-bottom:10px; margin-bottom:12px; -webkit-overflow-scrolling:touch; }
.chip-row::-webkit-scrollbar { display:none; }
.chip { flex-shrink:0; padding:7px 14px; border-radius:999px; border:1.5px solid var(--border); background:var(--bg-elevated); color:var(--ink); font-family:'Cairo',sans-serif; font-weight:700; font-size:0.8rem; cursor:pointer; white-space:nowrap; }
.chip.active { background:var(--teal); border-color:var(--teal); color:var(--teal-contrast); }

.ayah-box { position:relative; background:var(--gold-soft); border-bottom:1px solid var(--border); padding:26px 22px 20px; text-align:center; }
.ayah-box .mark { position:absolute; color:var(--gold); font-size:1.1rem; opacity:.75; }
.ayah-box .mark.tl { top:10px; right:12px; } .ayah-box .mark.br { bottom:10px; left:12px; }
.ayah-text { font-family:'Amiri Quran',serif; font-size:1.5rem; line-height:2.25; color:var(--teal-deep); direction:rtl; }
:root[data-theme="dark"] .ayah-text { color:var(--gold); }
.ayah-ref { margin-top:10px; font-size:.8rem; color:var(--ink-soft); font-weight:700; }

.q-body { padding:22px; }
.q-text { font-size:1.05rem; font-weight:700; line-height:1.8; margin:0 0 18px; }
.options { display:flex; flex-direction:column; gap:10px; }
.opt { display:flex; align-items:center; gap:10px; padding:13px 16px; border-radius:12px; border:1.5px solid var(--border); background:var(--bg); color:var(--ink); font-family:'Cairo',sans-serif; font-size:.98rem; font-weight:600; text-align:right; cursor:pointer; transition:border-color .15s,background .15s; }
.opt:hover:not(:disabled) { border-color:var(--teal); }
.opt .badge { flex-shrink:0; width:26px; height:26px; border-radius:50%; background:var(--border); color:var(--ink-soft); display:flex; align-items:center; justify-content:center; font-size:.8rem; font-weight:800; }
.opt.correct { background:var(--success-soft); border-color:var(--success); } .opt.correct .badge { background:var(--success); color:#fff; }
.opt.wrong { background:var(--error-soft); border-color:var(--error); } .opt.wrong .badge { background:var(--error); color:#fff; }
.opt:disabled { cursor:default; }

.feedback { margin-top:16px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
.feedback .msg { font-weight:800; font-size:.95rem; }
.feedback .msg.correct { color:var(--success); } .feedback .msg.wrong { color:var(--error); }
.next-btn { border:none; background:var(--teal); color:var(--teal-contrast); font-family:'Cairo',sans-serif; font-weight:800; font-size:.95rem; padding:11px 22px; border-radius:10px; cursor:pointer; }
.next-btn:hover { opacity:.92; }

.progress-line { display:flex; align-items:center; gap:8px; margin-bottom:14px; font-size:.78rem; color:var(--ink-soft); font-weight:700; }
.progress-line .bar { flex:1; height:5px; border-radius:3px; background:var(--border); overflow:hidden; }
.progress-line .bar > div { height:100%; background:var(--teal); }

.lb-list, .badge-list { display:flex; flex-direction:column; gap:8px; }
.lb-row { display:flex; align-items:center; gap:12px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:12px; padding:12px 14px; box-shadow:var(--shadow); }
.lb-rank { width:26px; text-align:center; font-weight:800; color:var(--ink-soft); }
.lb-rank.top1 { color:var(--gold); font-size:1.1rem; }
.lb-name { flex:1; font-weight:700; font-size:.92rem; }
.lb-score { font-weight:800; color:var(--teal); }
:root[data-theme="dark"] .lb-score { color:var(--gold); }
.empty-state { text-align:center; padding:40px 20px; color:var(--ink-soft); font-size:.9rem; }
.hint { text-align:center; color:var(--ink-soft); font-size:.8rem; margin-top:14px; }
.done-card { text-align:center; padding:40px 24px; }
.done-card .big { font-size:2.4rem; margin-bottom:8px; }

.section-title { font-weight:800; font-size:.95rem; margin: 4px 0 10px; }

.badge-item { display:flex; align-items:center; gap:12px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:14px; padding:14px; box-shadow:var(--shadow); }
.badge-item.locked { opacity:.45; }
.badge-icon { font-size:1.6rem; width:42px; text-align:center; flex-shrink:0; }
.badge-info b { display:block; font-size:.92rem; }
.badge-info span { font-size:.78rem; color:var(--ink-soft); }

.daily-hero { text-align:center; padding:30px 20px; }
.daily-hero .big { font-size:2.6rem; }
.daily-hero h2 { margin:6px 0 4px; font-size:1.15rem; }
.daily-hero p { color:var(--ink-soft); font-size:.88rem; margin:0 0 18px; }
.daily-streak-badge { display:inline-flex; align-items:center; gap:6px; background:var(--gold-soft); color:var(--gold); font-weight:800; padding:6px 14px; border-radius:999px; font-size:.85rem; margin-top:10px; }
</style>
</head>
<body>

<div class="topbar">
  <h1>سبيل الإعراب</h1>
  <div class="stats">
    <div class="stat"><span>🔥</span><span id="streakVal">0</span></div>
    <div class="stat"><span>⭐</span><span id="scoreVal">0</span></div>
  </div>
</div>

<div class="wrap" id="wrap">
  <div id="practiceView"></div>
  <div id="dailyView" style="display:none;"></div>
  <div id="badgesView" style="display:none;"></div>
  <div id="leaderboardView" style="display:none;"></div>
</div>

<div class="tabs">
  <button class="tab active" id="tabPractice" onclick="showTab('practice')"><span class="icon">📖</span>تدرّب</button>
  <button class="tab" id="tabDaily" onclick="showTab('daily')"><span class="icon">🗓️</span>التحدي اليومي</button>
  <button class="tab" id="tabBadges" onclick="showTab('badges')"><span class="icon">🏅</span>الإنجازات</button>
  <button class="tab" id="tabLeaderboard" onclick="showTab('leaderboard')"><span class="icon">🏆</span>الصدارة</button>
</div>


<script>
let QUESTIONS = [];
let SURAHS = [];
let QUESTIONS_BY_ID = {};
let dataReady = false;

async function loadQuestionData() {
  const wrap = document.getElementById('wrap');
  try {
    const res = await fetch('questions.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    QUESTIONS = data.questions || [];
    SURAHS = data.surahs || [];
    QUESTIONS_BY_ID = Object.fromEntries(QUESTIONS.map(q => [q.id, q]));
    dataReady = true;
  } catch (e) {
    wrap.innerHTML = `<div class="card done-card">
      <div class="big">⚠️</div>
      <p style="font-weight:800; font-size:1.05rem; margin:0 0 8px;">تعذّر تحميل ملف الأسئلة</p>
      <p style="color:var(--ink-soft); font-size:.85rem; line-height:1.7; margin:0;">
        تأكّد أن ملف <code>questions.json</code> موجود في نفس مجلد <code>index.html</code>،
        وأنك تفتح الصفحة عبر خادم فعلي (مثل GitHub Pages أو
        <code>python3 -m http.server</code>) وليس بفتح الملف مباشرة من جهازك.
      </p></div>`;
    throw e;
  }
}

const BADGE_DEFS = [
  { id: 'first',      icon:'🌱', name:'الخطوة الأولى',   desc:'أول إجابة صحيحة',          test: s => s.totalCorrect >= 1 },
  { id: 'streak10',   icon:'🔥', name:'مثابر',            desc:'10 إجابات صحيحة متتالية',   test: s => s.bestStreak >= 10 },
  { id: 'streak25',   icon:'⚡', name:'ملتهب',            desc:'25 إجابة صحيحة متتالية',    test: s => s.bestStreak >= 25 },
  { id: 'streak50',   icon:'🌟', name:'لا يُوقَف',        desc:'50 إجابة صحيحة متتالية',    test: s => s.bestStreak >= 50 },
  { id: 'q100',       icon:'📘', name:'قارئ مجتهد',       desc:'100 سؤال مُجاب',            test: s => s.totalAnswered >= 100 },
  { id: 'q500',       icon:'📗', name:'طالب علم',         desc:'500 سؤال مُجاب',            test: s => s.totalAnswered >= 500 },
  { id: 'q1000',      icon:'📕', name:'حافظ الإعراب',     desc:'1000 سؤال مُجاب',           test: s => s.totalAnswered >= 1000 },
  { id: 'daily7',     icon:'🗓️', name:'أسبوع الالتزام',   desc:'7 أيام متتالية في التحدي اليومي', test: s => s.dailyStreak >= 7 },
  { id: 'daily30',    icon:'🌙', name:'شهر الالتزام',     desc:'30 يومًا متتالية في التحدي اليومي', test: s => s.dailyStreak >= 30 },
  { id: 'surah1',     icon:'🕌', name:'إتقان سورة',       desc:'أكمل كل أسئلة سورة واحدة',   test: s => s.completedSurahs.length >= 1 },
  { id: 'surah5',     icon:'🏛️', name:'خمس سور',          desc:'أكمل كل أسئلة خمس سور',      test: s => s.completedSurahs.length >= 5 },
];

let state = {
  score: 0, streak: 0, bestStreak: 0, totalCorrect: 0, totalAnswered: 0,
  answered: {}, order: [], pos: 0, filterSurah: null,
  earnedBadges: {}, dailyStreak: 0, lastDailyDate: null,
  daily: null, // {date, ids:[], idx, correctCount}
};

let db = null, user = null, uid = null;
let currentQ = null, answeredThisQ = false;

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function daysBetween(a, b) {
  const d1 = new Date(a), d2 = new Date(b);
  return Math.round((d2 - d1) / 86400000);
}
function seededShuffle(arr, seedStr) {
  let seed = 0;
  for (let i=0;i<seedStr.length;i++) seed = (seed*31 + seedStr.charCodeAt(i)) >>> 0;
  const rnd = () => { seed = (seed*1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  const a = arr.slice();
  for (let i=a.length-1;i>0;i--) { const j = Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function shuffledIds(pool) {
  const ids = pool.map(q => q.id);
  for (let i=ids.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [ids[i],ids[j]]=[ids[j],ids[i]]; }
  return ids;
}
function currentPool() {
  return state.filterSurah ? QUESTIONS.filter(q => q.s === state.filterSurah) : QUESTIONS;
}
function updateHUD() {
  document.getElementById('streakVal').textContent = state.streak;
  document.getElementById('scoreVal').textContent = state.score;
}

// ---------- شارات الإنجاز ----------
function surahIds(surahName) { return QUESTIONS.filter(q => q.s === surahName).map(q => q.id); }
function computeCompletedSurahs() {
  return SURAHS.filter(s => {
    const ids = surahIds(s);
    return ids.length > 0 && ids.every(id => state.answered[id]);
  });
}
function checkBadges() {
  const stats = {
    totalCorrect: state.totalCorrect, totalAnswered: state.totalAnswered,
    bestStreak: state.bestStreak, dailyStreak: state.dailyStreak,
    completedSurahs: computeCompletedSurahs(),
  };
  let newly = [];
  BADGE_DEFS.forEach(b => {
    if (!state.earnedBadges[b.id] && b.test(stats)) { state.earnedBadges[b.id] = true; newly.push(b); }
  });
  return newly;
}

// ---------- عرض سؤال ----------
function renderQuestion() {
  const view = document.getElementById('practiceView');
  const pool = currentPool();
  let nextId = null;
  while (state.pos < state.order.length) {
    const id = state.order[state.pos];
    if (!state.answered[id] && QUESTIONS_BY_ID[id]) { nextId = id; break; }
    state.pos++;
  }

  const filterChips = `<div class="chip-row">
    <button class="chip ${!state.filterSurah?'active':''}" onclick="setFilter(null)">الكل</button>
    ${SURAHS.map(s => `<button class="chip ${state.filterSurah===s?'active':''}" onclick="setFilter('${s}')">${s}</button>`).join('')}
  </div>`;

  if (!nextId) {
    view.innerHTML = filterChips + `
      <div class="card done-card">
        <div class="big">🌙</div>
        <p style="font-weight:800; font-size:1.1rem; margin:0 0 6px;">أتممت كل الأسئلة المتاحة${state.filterSurah ? ' في ' + state.filterSurah : ''}</p>
        <p style="color:var(--ink-soft); font-size:.9rem; margin:0 0 20px;">أحسنت! ابدأ جولة جديدة للمراجعة.</p>
        <button class="next-btn" onclick="restartRound()">جولة جديدة</button>
      </div>`;
    return;
  }
  currentQ = QUESTIONS_BY_ID[nextId];
  answeredThisQ = false;

  const answeredInPool = pool.filter(q => state.answered[q.id]).length;
  const pct = Math.round((answeredInPool / pool.length) * 100);

  view.innerHTML = filterChips + `
    <div class="progress-line"><span>${answeredInPool} / ${pool.length}</span><div class="bar"><div style="width:${pct}%"></div></div></div>
    <div class="card">${questionCardInner(currentQ)}</div>
    <p class="hint">اختر الإجابة التي تراها صحيحة</p>`;
}

function questionCardInner(q) {
  let ayahHtml = '';
  if (q.a) {
    ayahHtml = `<div class="ayah-box"><span class="mark tl">۞</span>
      <div class="ayah-text">﴿ ${q.a} ﴾</div>
      <div class="ayah-ref">${q.aref || ''}</div>
      <span class="mark br">۞</span></div>`;
  }
  const letters = ['أ','ب','ج','د','ه'];
  const optsHtml = q.o.map((opt,i) => `<button class="opt" data-i="${i}" onclick="selectOption(${i})"><span class="badge">${letters[i]}</span><span>${opt}</span></button>`).join('');
  return `${ayahHtml}<div class="q-body"><p class="q-text">${q.q}</p><div class="options" id="optionsWrap">${optsHtml}</div><div id="feedbackWrap"></div></div>`;
}

function setFilter(surah) { state.filterSurah = surah; renderQuestion(); }

function selectOption(i, isDaily) {
  if (answeredThisQ) return;
  answeredThisQ = true;
  const q = isDaily ? QUESTIONS_BY_ID[state.daily.ids[state.daily.idx]] : currentQ;
  const correct = i === q.c;
  const wrapId = isDaily ? '#dailyOptionsWrap' : '#optionsWrap';
  const fbId = isDaily ? 'dailyFeedbackWrap' : 'feedbackWrap';
  document.querySelectorAll(wrapId + ' .opt').forEach((b, idx) => {
    b.disabled = true;
    if (idx === q.c) b.classList.add('correct');
    else if (idx === i) b.classList.add('wrong');
  });

  state.totalAnswered += 1;
  if (correct) {
    state.score += 10; state.streak += 1; state.bestStreak = Math.max(state.bestStreak, state.streak);
    state.totalCorrect += 1;
  } else { state.streak = 0; }
  if (!isDaily) state.answered[q.id] = true;

  updateHUD();
  const newBadges = checkBadges();
  saveProgress();

  const fb = document.getElementById(fbId);
  const nextBtn = isDaily ? `onclick="nextDailyQuestion()"` : `onclick="nextQuestion()"`;
  fb.innerHTML = `<div class="feedback">
      <span class="msg ${correct?'correct':'wrong'}">${correct?'إجابة صحيحة! أحسنت 🎉':'ليست هذه الإجابة الصحيحة'}</span>
      <button class="next-btn" ${nextBtn}>${isDaily && state.daily.idx === state.daily.ids.length-1 ? 'إنهاء' : 'التالي'}</button>
    </div>`;

  if (newBadges.length) {
    const extra = document.createElement('p');
    extra.className = 'hint';
    extra.textContent = '🏅 حصلت على وسام جديد: ' + newBadges.map(b=>b.name).join('، ');
    fb.appendChild(extra);
  }
}
function nextQuestion() { state.pos++; renderQuestion(); }
function restartRound() { state.answered = {}; state.order = shuffledIds(QUESTIONS); state.pos = 0; saveProgress(); renderQuestion(); }

// ---------- التحدي اليومي ----------
function ensureDailyState() {
  const today = todayStr();
  if (!state.daily || state.daily.date !== today) {
    const shuffled = seededShuffle(QUESTIONS.map(q=>q.id), today);
    state.daily = { date: today, ids: shuffled.slice(0, 10), idx: 0, correctCount: 0, completed: false };
  }
}
function renderDaily() {
  ensureDailyState();
  const view = document.getElementById('dailyView');
  if (state.daily.completed) {
    view.innerHTML = `<div class="card daily-hero">
      <div class="big">✅</div>
      <h2>أتممت تحدي اليوم</h2>
      <p>عد غدًا لتحدٍ جديد وتحافظ على سلسلتك</p>
      <div class="daily-streak-badge">🔥 ${state.dailyStreak} يومًا متتاليًا</div>
    </div>`;
    return;
  }
  const q = QUESTIONS_BY_ID[state.daily.ids[state.daily.idx]];
  view.innerHTML = `
    <div class="progress-line"><span>${state.daily.idx+1} / ${state.daily.ids.length}</span><div class="bar"><div style="width:${(state.daily.idx/state.daily.ids.length)*100}%"></div></div></div>
    <div class="card">${questionCardInnerDaily(q)}</div>
    <p class="hint">تحدٍ يومي من 10 أسئلة — أكمله للحفاظ على سلسلتك 🔥</p>`;
}
function questionCardInnerDaily(q) {
  let ayahHtml = '';
  if (q.a) ayahHtml = `<div class="ayah-box"><span class="mark tl">۞</span><div class="ayah-text">﴿ ${q.a} ﴾</div><div class="ayah-ref">${q.aref||''}</div><span class="mark br">۞</span></div>`;
  const letters = ['أ','ب','ج','د','ه'];
  const optsHtml = q.o.map((opt,i) => `<button class="opt" data-i="${i}" onclick="selectOption(${i}, true)"><span class="badge">${letters[i]}</span><span>${opt}</span></button>`).join('');
  return `${ayahHtml}<div class="q-body"><p class="q-text">${q.q}</p><div class="options" id="dailyOptionsWrap">${optsHtml}</div><div id="dailyFeedbackWrap"></div></div>`;
}
function nextDailyQuestion() {
  if (state.daily.idx >= state.daily.ids.length - 1) {
    state.daily.completed = true;
    const today = state.daily.date;
    if (state.lastDailyDate && daysBetween(state.lastDailyDate, today) === 1) state.dailyStreak += 1;
    else if (state.lastDailyDate !== today) state.dailyStreak = 1;
    state.lastDailyDate = today;
    checkBadges();
    saveProgress();
  } else { state.daily.idx += 1; }
  renderDaily();
}

// ---------- الإنجازات ----------
function renderBadges() {
  const view = document.getElementById('badgesView');
  checkBadges();
  view.innerHTML = `<p class="section-title">🏅 شارات الإنجاز</p><div class="badge-list">` +
    BADGE_DEFS.map(b => {
      const earned = !!state.earnedBadges[b.id];
      return `<div class="badge-item ${earned?'':'locked'}"><div class="badge-icon">${b.icon}</div>
        <div class="badge-info"><b>${b.name}</b><span>${b.desc}</span></div></div>`;
    }).join('') + `</div>`;
}

function showTab(name) {
  ['Practice','Daily','Badges','Leaderboard'].forEach(n => {
    document.getElementById('tab'+n).classList.toggle('active', n.toLowerCase()===name);
    document.getElementById(n.toLowerCase()+'View').style.display = n.toLowerCase()===name ? '' : 'none';
  });
  if (name === 'leaderboard') renderLeaderboard();
  if (name === 'daily') renderDaily();
  if (name === 'badges') renderBadges();
}

// ---------- تخزين محلي ----------
function loadLocal() {
  try {
    const raw = localStorage.getItem('irab_progress_v2');
    if (raw) Object.assign(state, JSON.parse(raw));
  } catch (e) {}
}
function saveLocal() {
  try { localStorage.setItem('irab_progress_v2', JSON.stringify(state)); } catch (e) {}
}

let saveTimer = null;
function saveProgress() {
  saveLocal();
  if (!db || !uid) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      await db.doc('data/users/' + uid + '/progress').set({ ...state, ts: Date.now() });
      await db.doc('leaderboard/' + uid).set({ score: state.score, bestStreak: state.bestStreak, ts: Date.now() });
    } catch (e) {}
  }, 400);
}

async function renderLeaderboard() {
  const view = document.getElementById('leaderboardView');
  view.innerHTML = `<p class="hint">جارٍ تحميل لوحة الصدارة…</p>`;
  if (!db) { view.innerHTML = `<div class="empty-state">لوحة الصدارة غير متاحة حاليًا. تقدّمك محفوظ في هذا الجهاز فقط.</div>`; return; }
  try {
    const snap = await db.collection('leaderboard').orderBy('score','desc').limit(20).get();
    if (snap.empty) { view.innerHTML = `<div class="empty-state">لا توجد نتائج بعد. كن أول من يظهر هنا! 🏆</div>`; return; }
    const ids = snap.docs.map(d => d.id);
    let names = {};
    if (user) { try { names = await user.profiles(ids); } catch (e) {} }
    const rows = snap.docs.map((d, idx) => {
      const isMe = d.id === uid;
      const medal = idx===0?'🥇':idx===1?'🥈':idx===2?'🥉':(idx+1);
      return `<div class="lb-row" style="${isMe?'border-color:var(--teal);':''}"><span class="lb-rank ${idx===0?'top1':''}">${medal}</span><span class="lb-name"></span><span class="lb-score">${d.data().score||0}</span></div>`;
    });
    view.innerHTML = `<div class="lb-list">${rows.join('')}</div>`;
    const nameSpans = view.querySelectorAll('.lb-name');
    snap.docs.forEach((d, idx) => {
      const isMe = d.id === uid;
      nameSpans[idx].textContent = (names[d.id] && names[d.id].name) || (isMe?'أنت':'مشارك');
    });
  } catch (e) { view.innerHTML = `<div class="empty-state">تعذّر تحميل لوحة الصدارة الآن.</div>`; }
}

async function initClaudeCapabilities() {
  try { db = await (window.claude ? window.claude.use('db') : null); } catch (e) { db = null; }
  try { user = await (window.claude ? window.claude.use('user') : null); } catch (e) { user = null; }
  if (user) { try { uid = await user.id(); } catch (e) { uid = null; } }
  if (db && uid) {
    try {
      const snap = await db.doc('data/users/' + uid + '/progress').get();
      if (snap.exists) Object.assign(state, snap.data());
    } catch (e) {}
  }
  updateHUD();
}

document.getElementById('practiceView').innerHTML = '<p class="hint">جارٍ تحميل الأسئلة…</p>';
loadQuestionData().then(() => {
  loadLocal();
  if (!state.order || !state.order.length) state.order = shuffledIds(QUESTIONS);
  updateHUD();
  renderQuestion();
  initClaudeCapabilities();
}).catch(() => { /* رسالة الخطأ ظهرت بالفعل داخل loadQuestionData */ });
</script>
</body>
